<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            background: linear-gradient(90deg, skyblue,purple,blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form{
            height: 80%;
            width: 30%;
            border-radius: 10px;
            background-color: white;
            text-transform: capitalize;
        }
        *{
             margin : 0;
             padding: 0;
            box-sizing: border-box;
        }
         .email,.password,.button{
            width: 80%;
            height: 20%;
            margin: auto;
            margin-top: 5%;
         }
        
        input{ 
            margin-top: 3%;
            width: 100%;
            height:50%;
        }

        button{
            width: 100%;
            background: linear-gradient(90deg, skyblue,purple,blue);
            height: 50%; 
            margin-top: 5%;
            border: none;
            color: white;
            border-radius: 20px;
        }
        .button{
            height: 20%;
            text-align: center;
        }
        p{
            margin-top: 10%;
        }
        h1{
            margin-top: 10%;
        }
        a{
            text-decoration: none;
        }
    </style>

</head>
<body>
    <div class="form">
        <h1 align = "center">Login form</h1>
        
        <div class="email">
        <label for="">Email or Phone:</label><br>
        <input type="email" name ="" id="" placeholder="xyz@gmail.com">
        </div>
        <div class="password">
        <label for="">Password</label><br>
        <input type="password" name ="" id="" placeholder="xyz123">
        <p>Forget password ?</p>
        </div>
        <div class="button">
        <button>Sign up</button>
        <p>Not  a Member ?<a href="signup.html">signup</a></p>

        </div>
    </div>
    
</body>
</html>
